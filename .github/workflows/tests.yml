name: Tests CI
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Configurer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Lancer pytest
      run: pytest